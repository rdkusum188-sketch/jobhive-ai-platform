version: "3.9"

services:
  backend:
    build: ./backend
    container_name: jobhive-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./jobhive.db
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    container_name: jobhive-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
